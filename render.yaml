services:
  - type: web
    name: mailcheck-app
    runtime: python
    buildCommand: "npm install && npm run build && pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ENABLE_SMTP_CHECK
        value: "false"
      - key: MAX_BATCH_SIZE
        value: "100"
      - key: DNS_TIMEOUT_SECONDS
        value: "3.0"
    healthCheckPath: /api/health
